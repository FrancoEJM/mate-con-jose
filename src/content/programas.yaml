# Los programas largos que se muestran en la sección Servicios.
# El orden de esta lista es el orden en que aparecen las tarjetas.
#
#   destacado: true      pinta la tarjeta oscura con la cinta "Más elegido". Solo uno.
#   pdf:                 archivo dentro de public/pdf/, escrito como /pdf/nombre.pdf
#   incluye:             lista larga que reemplaza a los bullets dentro del modal.
#   plan / valores:      opcionales; si no están, el modal muestra solo los bullets.

- id: intensivo
  titulo: Intensivo PAES
  duracion: 12 semanas
  resumen: Ritmo acelerado para quienes parten con menos tiempo.
  descripcion: Preparación acelerada para quienes parten con menos tiempo, enfocada en los contenidos de mayor impacto.
  pdf: /pdf/programa-intensivo-paes-m1.pdf
  bullets:
    - Contenidos priorizados por impacto
    - Ensayos cronometrados
    - Técnicas de resolución rápida
    - Cobertura M1 y M2
  incluye:
    - Clase de diagnóstico personalizada
    - 24 clases en vivo (2 semanales de 1h 15min)
    - Resúmenes teóricos de cada unidad
    - 12 guías de ejercicios tipo PAES
    - Formularios con fórmulas y conceptos clave
    - Videos de resolución paso a paso
    - 3 ensayos tipo PAES durante el programa
    - Estrategias para enfrentar la PAES
    - Seguimiento de dudas por WhatsApp
    - Planificación semanal organizada
    - Revisión detallada de guías y ensayos
  plan:
    - eje: Números
      semanas: 3
    - eje: Álgebra
      semanas: 2
    - eje: Funciones
      semanas: 2
    - eje: Geometría
      semanas: 3
    - eje: Probabilidad y estadística
      semanas: 2
  valoresNota: duración 3 meses
  valores:
    - etiqueta: Pago mensual
      monto: 3 × $79.990
      detalle: Total $239.970 · el 1° de cada mes
    - etiqueta: 2 cuotas
      monto: 2 × $109.990
      detalle: Total $219.980 · al inicio y en la semana 5
    - etiqueta: Pago único
      monto: $199.990
      detalle: El más conveniente
      destacado: true

